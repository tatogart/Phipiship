<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Анимка — PhipiShip Флот</title>
  <link rel="icon" href="icon-animka.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
  <script src="suite.js"></script>
</head>
<body class="animka">
  <header class="menubar">
    <div class="brand">
      <img src="icon-animka.svg" alt="" width="22" height="22">
      <span>Анимка</span>
    </div>

    <nav class="menus">
      <div class="menu">
        <button class="menu-title">Файл</button>
        <div class="dropdown">
          <button data-action="new">Новая анимация…</button>
          <button data-action="open">Открыть… <kbd>Ctrl+O</kbd></button>
          <button data-action="importFrame">Картинка в новый кадр…</button>
          <hr>
          <button data-action="save">Сохранить .animka <kbd>Ctrl+S</kbd></button>
          <hr>
          <button data-action="exportGif">Экспорт GIF…</button>
          <button data-action="exportSheet">Экспорт спрайт-листа PNG</button>
          <button data-action="exportFrame">Экспорт текущего кадра PNG</button>
          <button data-action="toPhoto">Открыть кадры в PhipiShip Фото</button>
          <hr>
          <button data-action="harbor">⚓ Гавань — все программы</button>
        </div>
      </div>
      <div class="menu">
        <button class="menu-title">Правка</button>
        <div class="dropdown">
          <button data-action="undo">Отменить <kbd>Ctrl+Z</kbd></button>
          <button data-action="redo">Повторить <kbd>Ctrl+Shift+Z</kbd></button>
          <hr>
          <button data-action="clearFrame">Очистить кадр <kbd>Del</kbd></button>
        </div>
      </div>
      <div class="menu">
        <button class="menu-title">Кадр</button>
        <div class="dropdown">
          <button data-action="addFrame">Новый кадр <kbd>N</kbd></button>
          <button data-action="dupFrame">Дублировать кадр <kbd>Ctrl+J</kbd></button>
          <button data-action="delFrame">Удалить кадр</button>
          <hr>
          <button data-action="moveLeft">Сдвинуть влево</button>
          <button data-action="moveRight">Сдвинуть вправо</button>
          <hr>
          <button data-action="prev">Предыдущий кадр <kbd>,</kbd></button>
          <button data-action="next">Следующий кадр <kbd>.</kbd></button>
          <button data-action="play">Играть / стоп <kbd>Enter</kbd></button>
        </div>
      </div>
      <div class="menu">
        <button class="menu-title">Вид</button>
        <div class="dropdown">
          <button data-action="toggleOnion">Калька вкл/выкл <kbd>K</kbd></button>
          <hr>
          <button data-action="zoomIn">Приблизить <kbd>Ctrl++</kbd></button>
          <button data-action="zoomOut">Отдалить <kbd>Ctrl+−</kbd></button>
          <button data-action="fit">По размеру окна <kbd>Ctrl+0</kbd></button>
        </div>
      </div>
      <div class="menu">
        <button class="menu-title">Справка</button>
        <div class="dropdown">
          <button data-action="shortcuts">Горячие клавиши</button>
          <button data-action="about">Об Анимке</button>
        </div>
      </div>
    </nav>

    <div class="themes" title="Тема оформления">
      <button data-theme-pick="ocean" title="Ночное море"></button>
      <button data-theme-pick="sunset" title="Закат"></button>
      <button data-theme-pick="lagoon" title="Лагуна"></button>
      <button data-theme-pick="sail" title="Парус (светлая)"></button>
    </div>
    <div class="history-btns">
      <button id="panelToggle" class="panel-toggle" title="Панель">☰</button>
      <button id="undoBtn" data-action="undo" title="Отменить (Ctrl+Z)">↶</button>
      <button id="redoBtn" data-action="redo" title="Повторить (Ctrl+Shift+Z)">↷</button>
    </div>
  </header>

  <div class="optionsbar">
    <span class="opt-tool" id="optToolName">Кисть</span>
    <label data-for="brush eraser line rect ellipse">Размер
      <input type="range" id="size" min="1" max="120" value="6">
      <output id="sizeOut">6</output>
    </label>
    <label data-for="brush eraser line rect ellipse fill">Непрозрачность
      <input type="range" id="opacity" min="1" max="100" value="100">
      <output id="opacityOut">100%</output>
    </label>
    <label data-for="fill">Допуск
      <input type="range" id="tolerance" min="0" max="255" value="32">
      <output id="toleranceOut">32</output>
    </label>
    <label data-for="rect ellipse"><input type="checkbox" id="shapeFill"> Заливка</label>
    <span data-for="picker hand" class="hint" id="toolHint"></span>
  </div>

  <main class="workspace">
    <aside class="toolbar">
      <button data-tool="brush" title="Кисть (B)"><svg viewBox="0 0 24 24"><path d="M9.5 14.5 20 4a1.4 1.4 0 0 0-2-2L7.5 12.5"/><path d="M7 13c-2 0-3.5 1.5-3.5 3.5 0 1.5-1 2.5-1.5 3 3 .5 7-.5 7-4.5a2 2 0 0 0-2-2z"/></svg></button>
      <button data-tool="eraser" title="Ластик (E)"><svg viewBox="0 0 24 24"><path d="m7 21-4-4L14 6l7 7-8 8H7zM9.5 10.5l7 7M13 21h8"/></svg></button>
      <button data-tool="fill" title="Заливка (G)"><svg viewBox="0 0 24 24"><path d="m4 11 7-7 8 8-7 7zM4 11h15M20 15s2 2.7 2 4a2 2 0 0 1-4 0c0-1.3 2-4 2-4z"/></svg></button>
      <button data-tool="picker" title="Пипетка (I)"><svg viewBox="0 0 24 24"><path d="M14 7 5 16v3h3l9-9M13 6l5 5M16 3.5a2.5 2.5 0 0 1 3.5 0l1 1a2.5 2.5 0 0 1 0 3.5L18 10.5 13.5 6z"/></svg></button>
      <span class="sep"></span>
      <button data-tool="line" title="Линия (L)"><svg viewBox="0 0 24 24"><path d="M5 19 19 5"/></svg></button>
      <button data-tool="rect" title="Прямоугольник (U)"><svg viewBox="0 0 24 24"><rect x="4" y="6" width="16" height="12" rx="1"/></svg></button>
      <button data-tool="ellipse" title="Эллипс (O)"><svg viewBox="0 0 24 24"><ellipse cx="12" cy="12" rx="9" ry="7"/></svg></button>
      <span class="sep"></span>
      <button data-tool="hand" title="Рука (H, или зажать Пробел)"><svg viewBox="0 0 24 24"><path d="M8 13V5.5a1.5 1.5 0 0 1 3 0V11M11 11V4a1.5 1.5 0 0 1 3 0v7M14 11V5.5a1.5 1.5 0 0 1 3 0V14c0 4-3 7-7 7-3 0-4.5-1.5-6-4l-1.6-2.8a1.5 1.5 0 0 1 2.6-1.5L8 15"/></svg></button>

      <div class="colors">
        <div class="swatches">
          <button id="secondarySwatch" class="swatch secondary" title="Фоновый цвет"></button>
          <button id="primarySwatch" class="swatch primary" title="Основной цвет"></button>
        </div>
        <div class="color-tools">
          <button id="swapColors" title="Поменять местами (X)">⇄</button>
        </div>
        <input type="color" id="primaryInput" value="#1d1d1f" hidden>
        <input type="color" id="secondaryInput" value="#ffffff" hidden>
      </div>
    </aside>

    <section class="viewport" id="viewport">
      <div class="stage" id="stage">
        <canvas id="view"></canvas>
      </div>
      <svg class="waves" viewBox="0 0 1200 60" preserveAspectRatio="none" aria-hidden="true">
        <path class="wave w1" d="M0 30 Q 75 10 150 30 T 300 30 T 450 30 T 600 30 T 750 30 T 900 30 T 1050 30 T 1200 30 T 1350 30 T 1500 30 T 1650 30 T 1800 30 T 1950 30 T 2100 30 T 2250 30 T 2400 30 V60 H0Z"/>
        <path class="wave w2" d="M0 38 Q 100 22 200 38 T 400 38 T 600 38 T 800 38 T 1000 38 T 1200 38 T 1400 38 T 1600 38 T 1800 38 T 2000 38 T 2200 38 T 2400 38 V60 H0Z"/>
      </svg>
      <div class="drop-hint">Отпустите: картинка станет новым кадром, а файл флота откроется</div>
    </section>

    <aside class="panel">
      <section class="panel-block">
        <h3>Палитра</h3>
        <div class="palette" id="palette"></div>
      </section>
      <section class="panel-block">
        <h3>Кадр</h3>
        <div class="row"><span>Текущий</span><span class="big-info" id="frameInfo">1 / 1</span></div>
        <div class="row"><span>Длительность</span><span id="durationInfo">—</span></div>
      </section>
      <section class="panel-block">
        <h3>Калька</h3>
        <div class="row"><label><input type="checkbox" id="onionPrev" checked> Предыдущий кадр</label><span style="color:#ff4d6d">●</span></div>
        <div class="row"><label><input type="checkbox" id="onionNext"> Следующий кадр</label><span style="color:#2fbf71">●</span></div>
        <div class="row"><span>Прозрачность</span><input type="range" id="onionAlpha" min="10" max="70" value="30"></div>
      </section>
      <section class="panel-block">
        <h3>Фон</h3>
        <div class="row">
          <label><input type="checkbox" id="bgOn" checked> Цвет фона</label>
          <input type="color" id="bgColor" value="#ffffff">
        </div>
      </section>
    </aside>
  </main>

  <section class="timeline">
    <div class="tl-controls">
      <button class="play" id="playBtn" data-action="play" title="Играть / стоп (Enter)">▶ Играть</button>
      <button data-action="prev" title="Предыдущий (,)">⏮</button>
      <button data-action="dupFrame" title="Дублировать (Ctrl+J)">⧉</button>
      <button data-action="next" title="Следующий (.)">⏭</button>
      <label>FPS <input type="number" id="fps" min="1" max="60" value="8"></label>
      <label><span><input type="checkbox" id="loop" checked> Повтор</span></label>
    </div>
    <div class="frames" id="frames"></div>
  </section>

  <footer class="statusbar">
    <span id="statusCoords">—</span>
    <span id="statusSize"></span>
    <span class="zoom-ctl">
      <button data-action="zoomOut" title="Отдалить">−</button>
      <span id="zoomLabel">100%</span>
      <button data-action="zoomIn" title="Приблизить">+</button>
    </span>
    <span id="statusMsg" class="msg"></span>
  </footer>

  <div class="modal" id="modal" hidden>
    <form class="modal-box" id="modalForm">
      <h2 id="modalTitle"></h2>
      <div id="modalBody" class="modal-body"></div>
      <div class="modal-buttons">
        <button type="button" id="modalCancel">Отмена</button>
        <button type="submit" id="modalOk" class="primary">OK</button>
      </div>
    </form>
  </div>

  <input type="file" id="fileOpen" hidden>
  <input type="file" id="fileImport" accept="image/*" hidden>

  <script src="ui.js"></script>
  <script src="animka.js"></script>
</body>
</html>
