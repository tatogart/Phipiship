<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0d2340">
  <link rel="apple-touch-icon" href="icon-192.png">
  <title>Кадр — PhipiShip Флот</title>
  <link rel="icon" href="icon-kadr.svg" type="image/svg+xml">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="style.css">
  <script src="suite.js"></script>
</head>
<body class="animka kadr">
  <header class="menubar">
    <div class="brand">
      <img src="icon-kadr.svg" alt="" width="22" height="22">
      <span>Кадр</span>
    </div>
    <nav class="menus">
      <div class="menu">
        <button class="menu-title">Файл</button>
        <div class="dropdown">
          <button data-action="new">Новый проект…</button>
          <button data-action="open">Открыть .kadr или видео… <kbd>Ctrl+O</kbd></button>
          <button data-action="importMedia">Добавить видео, фото, музыку… <kbd>Ctrl+I</kbd></button>
          <hr>
          <button data-action="save">Сохранить .kadr <kbd>Ctrl+S</kbd></button>
          <button data-action="exportVideo">Экспорт видео… <kbd>Ctrl+E</kbd></button>
          <button data-action="exportFrame">Экспорт кадра PNG</button>
          <hr>
          <button data-action="harbor">⚓ Гавань — все программы</button>
        </div>
      </div>
      <div class="menu">
        <button class="menu-title">Правка</button>
        <div class="dropdown">
          <button data-action="undo">Отменить <kbd>Ctrl+Z</kbd></button>
          <button data-action="redo">Повторить <kbd>Ctrl+Shift+Z</kbd></button>
          <hr>
          <button data-action="split">Разрезать в позиции курсора <kbd>S</kbd></button>
          <button data-action="duplicate">Дублировать клип <kbd>Ctrl+D</kbd></button>
          <button data-action="remove">Удалить клип <kbd>Del</kbd></button>
          <hr>
          <button data-action="moveLeft">Сдвинуть клип влево</button>
          <button data-action="moveRight">Сдвинуть клип вправо</button>
        </div>
      </div>
      <div class="menu">
        <button class="menu-title">Добавить</button>
        <div class="dropdown">
          <button data-action="addTitle">Титр (текст на фоне) <kbd>T</kbd></button>
          <button data-action="importMedia">Видео, фото, музыка…</button>
          <button data-action="removeMusic">Убрать фоновую музыку</button>
        </div>
      </div>
      <div class="menu">
        <button class="menu-title">Вид</button>
        <div class="dropdown">
          <button data-action="tlZoomIn">Таймлайн крупнее <kbd>+</kbd></button>
          <button data-action="tlZoomOut">Таймлайн мельче <kbd>−</kbd></button>
          <button data-action="tlFit">Весь фильм на таймлайне</button>
        </div>
      </div>
      <div class="menu">
        <button class="menu-title">Справка</button>
        <div class="dropdown">
          <button data-action="shortcuts">Горячие клавиши</button>
          <button data-action="about">О Кадре</button>
        </div>
      </div>
    </nav>
    <div class="themes" title="Тема оформления">
      <button data-theme-pick="ocean" title="Ночное море"></button>
      <button data-theme-pick="sunset" title="Закат"></button>
      <button data-theme-pick="lagoon" title="Лагуна"></button>
      <button data-theme-pick="sail" title="Парус (светлая)"></button>
    </div>
    <div class="history-btns">
      <button id="panelToggle" class="panel-toggle" title="Панель">☰</button>
      <button id="undoBtn" data-action="undo" title="Отменить (Ctrl+Z)">↶</button>
      <button id="redoBtn" data-action="redo" title="Повторить (Ctrl+Shift+Z)">↷</button>
    </div>
  </header>

  <div class="optionsbar transport">
    <button class="tbtn" data-action="toStart" title="В начало (Home)">⏮</button>
    <button class="tbtn play" id="playBtn" data-action="play" title="Играть / пауза (Пробел)">▶</button>
    <button class="tbtn" data-action="toEnd" title="В конец (End)">⏭</button>
    <span class="clock" id="clock">0:00.0 / 0:00.0</span>
    <button data-action="split" title="Разрезать клип (S)">✂ Разрезать</button>
    <button data-action="addTitle" title="Титр (T)">🅣 Титр</button>
    <button class="primary" data-action="exportVideo" title="Экспорт видео (Ctrl+E)">🎬 Экспорт</button>
    <span class="hint" id="formatInfo"></span>
  </div>

  <main class="workspace">
    <aside class="toolbar media-bar">
      <button data-action="importMedia" title="Добавить медиа (Ctrl+I)">＋</button>
      <div class="bin" id="bin"></div>
    </aside>

    <section class="viewport" id="viewport">
      <div class="stage" id="stage">
        <canvas id="view"></canvas>
      </div>
      <div class="wave-empty" id="empty">
        <img src="icon-kadr.svg" alt="" width="64" height="64">
        <p>Добавьте видео, фотографии или музыку —<br>они встанут на таймлайн по порядку.</p>
        <button class="primary" data-action="importMedia">Добавить файлы…</button>
      </div>
      <div class="drop-hint">Отпустите — файлы добавятся в фильм</div>
    </section>

    <aside class="panel">
      <section class="panel-block">
        <h3 id="clipTitle">Клип</h3>
        <div class="props" id="clipProps"><p class="hint-small">Выберите клип на таймлайне, чтобы настроить его.</p></div>
      </section>
      <section class="panel-block">
        <h3>Фоновая музыка</h3>
        <div id="musicBox" class="props"><p class="hint-small">Добавьте звуковой файл — он станет музыкой фильма.</p></div>
      </section>
    </aside>
  </main>

  <section class="timeline kadr-timeline">
    <div class="tl-scroll" id="tlScroll">
      <div class="tl-inner" id="tlInner">
        <canvas id="ruler" height="22"></canvas>
        <div class="track" id="track"></div>
        <div class="music-track" id="musicTrack"></div>
        <div class="playhead" id="playhead"></div>
      </div>
    </div>
  </section>

  <footer class="statusbar">
    <span id="statusCoords">—</span>
    <span class="zoom-ctl">
      <button data-action="tlZoomOut" title="Таймлайн мельче">−</button>
      <span id="zoomLabel">100%</span>
      <button data-action="tlZoomIn" title="Таймлайн крупнее">+</button>
    </span>
    <span id="statusMsg" class="msg"></span>
  </footer>

  <div class="modal" id="modal" hidden>
    <form class="modal-box" id="modalForm">
      <h2 id="modalTitle"></h2>
      <div id="modalBody" class="modal-body"></div>
      <div class="modal-buttons">
        <button type="button" id="modalCancel">Отмена</button>
        <button type="submit" id="modalOk" class="primary">OK</button>
      </div>
    </form>
  </div>

  <input type="file" id="fileOpen" hidden>
  <input type="file" id="fileMedia" accept="video/*,image/*,audio/*" multiple hidden>

  <script src="ui.js"></script>
  <script src="kadr.js"></script>
</body>
</html>
